<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DersTakip — Lise Ders, Not ve Sınav Asistanı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <!-- Mobil Üst Çubuk -->
    <header class="mobile-header">
      <button id="menu-toggle" class="icon-btn mobile-menu-btn" type="button" aria-label="Menüyü aç" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="mobile-brand">
        <span class="mobile-brand-dot" aria-hidden="true"></span>
        <span class="mobile-brand-text">DersTakip</span>
      </div>
      <div id="mobile-obp-pill" class="mobile-obp-pill" title="Genel Ağırlıklı Ortalama (OBP)">OBP: —</div>
    </header>

    <!-- Mobil Menü Arka Planı -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Sabit Sol Navigasyon Menüsü (Sidebar) -->
    <aside id="sidebar" class="sidebar" aria-label="Yan Menü">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
              <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
          </div>
          <div class="brand-copy">
            <span class="brand-title">DersTakip</span>
            <span class="brand-subtitle">Lise Çalışma Asistanı</span>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Ana menü">
        <button class="nav-item active" type="button" data-tab="dashboard">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="9" rx="2"></rect>
              <rect x="14" y="3" width="7" height="5" rx="2"></rect>
              <rect x="14" y="12" width="7" height="9" rx="2"></rect>
              <rect x="3" y="16" width="7" height="5" rx="2"></rect>
            </svg>
          </span>
          <span class="nav-label">Özet Paneli</span>
        </button>

        <button class="nav-item" type="button" data-tab="courses">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
              <path d="M8 7h6"></path>
              <path d="M8 11h8"></path>
            </svg>
          </span>
          <span class="nav-label">Dersler &amp; Notlar</span>
        </button>

        <button class="nav-item" type="button" data-tab="exams">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
              <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"></path>
            </svg>
          </span>
          <span class="nav-label">Sınav Takvimi</span>
          <span id="nav-exams-badge" class="nav-badge" hidden>0</span>
        </button>

        <button class="nav-item" type="button" data-tab="goals">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </span>
          <span class="nav-label">Günlük Çalışma &amp; Hedefler</span>
          <span id="nav-goals-badge" class="nav-badge nav-badge-muted">0/0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-obp-card">
          <div class="sidebar-obp-top">
            <span class="sidebar-obp-label">Ağırlıklı OBP</span>
            <span id="sidebar-obp-status" class="badge badge-neutral">Not Yok</span>
          </div>
          <div id="sidebar-obp-value" class="sidebar-obp-value">—</div>
        </div>

        <div class="sidebar-storage">
          <span class="storage-indicator">
            <span class="storage-dot" aria-hidden="true"></span>
            Veriler tarayıcıda saklanıyor
          </span>
          <button id="reset-data-btn" class="reset-link-btn" type="button">Verileri Sıfırla</button>
        </div>
      </div>
    </aside>

    <!-- Ana İçerik Alanı -->
    <main class="main-content">
      <div id="view-root" class="view-root" aria-live="polite"></div>
    </main>
  </div>

  <!-- Onay Modalı -->
  <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-hidden="true" hidden>
    <div class="modal-card">
      <h2 id="confirm-title" class="modal-title">Onay</h2>
      <p id="confirm-message" class="modal-message"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn btn-secondary" type="button">Vazgeç</button>
        <button id="confirm-ok" class="btn btn-danger" type="button">Onayla</button>
      </div>
    </div>
  </div>

  <!-- Bildirim Alanı (Toast) -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
